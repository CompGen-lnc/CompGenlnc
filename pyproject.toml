[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

# Build settings
[project]
name = "compgenlnc"
version = "0.1.0"
authors = []
description = "A features extractor from lncRNA-miRNA interactions based on sequences and 2D structures"
requires-python = ">= 3.12"
keywords = [
  "RNA",
  "lncRNA",
  "miRNA",
  "database",
  "miRanda",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.5.0",
  "pandas>=3.1.0",
  "gensim>=4.4.0",
  "opencv_python>=5.0.0.93",
  "torch>=2.12.0",
  "torch_geometric>=2.8.1",
  "tqdm>=4.70.1",
  "viennarna>=2.7.2",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

# Pytest settings
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]

python_files = ["test_*.py"]
python_functions = ["test_*"]

filterwarnings = [
  "ignore:.*torch.jit.script.*:DeprecationWarning"
]

# Ruff settings
[tool.ruff]
target-version = "py313"
line-length = 79

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "D",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
