[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

# Build settings
[project]
name = "compgenlnc"
dynamic = ["version"]
authors = [
  {name = "Cindy Calderón Arce"},
  {name = "Gabriel Calvo Montero"}
]
description = "A features extractor from lncRNA-miRNA interactions based on sequences and 2D structures"
requires-python = ">= 3.12"
keywords = [
  "RNA",
  "lncRNA",
  "miRNA",
  "database",
  "miRanda",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "gensim>=4.3.0",
  "numpy>=2.0.0",
  "opencv_python>=4.7.0",
  "pandas>=3.0.0",
  "requests>=2.28.0",
  "torch>=2.0.0,<2.15.0",
  "torch_geometric>=2.3.0",
  "tqdm>=4.65.0",
  "viennarna>=2.7.0",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"

# Package CLI
[project.scripts]
compgenlnc-install-deps = "compgenlnc.setup_deps:install_deps"

[tool.setuptools_scm]
write_to = "src/compgenlnc/_version.py"

# Pytest settings
[tool.pytest]
minversion = "9.0"
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = ["data", "__pycache__"]
markers = ["integration", "unit"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
  "ignore:.*torch.jit.script.*:DeprecationWarning"
]

# Ruff settings
[tool.ruff]
target-version = "py312"
line-length = 79
include = ["src/**/*.py", "tests/**/*.py"]
fix = true

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "D",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"__init__.py" = ["F401", "F403"]
"conftest.py" = ["F401", "F403"]
